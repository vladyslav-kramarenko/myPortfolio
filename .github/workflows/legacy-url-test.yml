name: Legacy URL preservation
on:
  push:
    branches:
      - experiment/static-html-hero
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-legacy-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging package
        run: node scripts/build-staging.mjs
      - name: Verify production package
        run: node scripts/build-production.mjs
      - name: Check LinkedIn experience dates
        run: node scripts/test-linkedin-dates.mjs
      - name: Verify production canonical URLs and sitemap
        run: node scripts/test-production-seo.mjs
      - name: Verify all historical Angular project URL mappings
        run: node scripts/test-old-portfolio-routes.mjs
      - name: Test mobile typewriter paper feed in headless Chrome
        run: node scripts/test-mobile-paper-motion.mjs
      - name: Smoke-test 173 legacy URLs, redirects, SEO and 404
        run: node scripts/test-legacy-urls.mjs
      - name: Audit actual Worker pages in responsive Chromium
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: node scripts/audit-live-site.mjs
      - name: Probe deployed Cloudflare staging Worker — historical URLs and redirects
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        env:
          TEST_BASE_URL: https://myportfolio.kramarenko-vladyslav-92.workers.dev
        run: node scripts/test-legacy-urls.mjs
      - name: Read-only production Worker acceptance test
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: node scripts/audit-production-deployment.mjs
